name: Patch Codex limit update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-codex-limit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Codex five-hour limit update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          post_path = Path('posts/2026-07-13.html')
          post = post_path.read_text(encoding='utf-8')

          new_card = '''<article class="card"><h3>Codex 与 ChatGPT Work 暂时移除 Plus、Business、Pro 的 5 小时限制</h3><div class="meta"><span class="pill s">S 级</span><span class="pill">Codex</span><span class="pill">用量限制</span><span class="pill">高可信｜OpenAI 核心产品负责人确认</span></div><p><b>重点事件：</b>OpenAI 核心产品负责人 Thibault Sottiaux 于 7 月 13 日明确表示，暂时移除 Plus、Business 和 Pro 计划在 Codex 与 ChatGPT Work 中的全部 5 小时使用限制，并在随后一小时内重置用户用量；同时正在推出降低 GPT-5.6 Sol 用量消耗的效率改动，量化结果将后续公布。</p><p><b>为什么值得关注：</b>这是直接影响付费用户连续任务能力的即时规则变化，尤其会影响长时间编码、并行 Agent 和 Work 工作流。原文使用“暂时移除”，不能解读为永久取消，也不能扩大到 ChatGPT 的所有功能。</p><p><b>落地建议：</b>Plus、Business 和 Pro 用户可立即检查 Codex/Work 用量页与重置状态；团队趁临时窗口完成长任务，但继续保留额度监控和中断恢复方案，并等待官方公布 Sol 效率改动的量化影响。</p><div class="sources"><a href="https://x.com/i/status/2076365965915467978" target="_blank" rel="noopener noreferrer">X 原帖</a></div></article>'''

          pattern = re.compile(r'<article class="card"><h3>超大规模云厂商即将接受AI资本回报检验</h3>.*?</article>', re.S)
          post, count = pattern.subn(new_card, post, count=1)
          if count != 1:
              raise RuntimeError('Target card not found or duplicated')

          old_lead = 'AI产业的关键变化正在从“发布更强模型”转向“重构工作流与控制权”：开发工具开始强化并行Agent、自动模式与遥测，企业服务转向前线部署，而供应链诱导、自动化勒索和资本回报成为必须立即治理的新约束。'
          new_lead = 'AI产业的关键变化正在从“发布更强模型”转向“重构工作流与使用边界”：Codex 与 ChatGPT Work 暂时移除付费计划的 5 小时限制，开发工具强化并行 Agent、自动模式与遥测，而供应链诱导和自动化勒索成为必须立即治理的新约束。'
          if old_lead not in post:
              raise RuntimeError('Lead text not found')
          post = post.replace(old_lead, new_lead, 1)

          post = post.replace('https://www.barrons.com/articles/big-tech-earnings-ai-spending-2c8774f5', 'https://x.com/i/status/2076365965915467978')
          post_path.write_text(post, encoding='utf-8')

          old_summary = 'Claude Code默认Auto Mode、Cursor 3.11、TCS前线部署工程师、Atlas退役、HalluSquatting与AI资本回报。'
          new_summary = 'Codex与ChatGPT Work暂时移除5小时限制、Claude Code Auto Mode、Cursor 3.11、TCS前线部署工程师、Atlas退役与HalluSquatting。'
          for filename in ('index.html', 'archive.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old_summary not in text:
                  raise RuntimeError(f'Summary not found in {filename}')
              path.write_text(text.replace(old_summary, new_summary, 1), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/2026-07-13.html index.html archive.html
          git rm .github/workflows/patch-codex-limit.yml
          git commit -m "Add Codex five-hour limit update"
          git push
