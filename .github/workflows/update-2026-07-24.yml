name: Update 2026-07-24 indexes
on:
  push:
    paths:
      - '.github/workflows/update-2026-07-24.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and archive
        run: |
          python - <<'PY'
          from pathlib import Path
          date='2026-07-24'
          summary='ChatGPT Health健康数据体验、AMD Helios整机生产、GitHub Issue与Linear Agent自动化、MCP升级、Dependabot冷却期及数据中心治理。'
          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          entry=f"<a class='card' href='posts/{date}.html'><h2>AI热点｜{date}</h2><p>{summary}</p></a>"
          if f"posts/{date}.html" not in s:
              s=s.replace("<div class='grid'>", "<div class='grid'>"+entry, 1)
              idx.write_text(s, encoding='utf-8')
          arc=Path('archive.html')
          s=arc.read_text(encoding='utf-8')
          entry=f"<a class='item' href='posts/{date}.html'><h2>AI热点｜{date}</h2><p>{summary}</p></a>"
          if f"posts/{date}.html" not in s:
              s=s.replace("<div class='list'>", "<div class='list'>"+entry, 1)
              arc.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-2026-07-24.yml
          git add index.html archive.html
          git commit -m 'Update index and archive for 2026-07-24'
          git push
