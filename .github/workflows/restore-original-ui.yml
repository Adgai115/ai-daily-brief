name: Restore original UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-original-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore light blue and white styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          styles = {
            'posts/2026-07-13.html': '''*{box-sizing:border-box}body{margin:0;background:#f3f7fd;color:#162238;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;padding:24px}.wrap{max-width:1180px;margin:auto;background:#fff;border:1px solid #e2eaf5;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(22,55,100,.09)}header{padding:42px 48px;background:radial-gradient(circle at 85% 0,#dcecff,transparent 34%),linear-gradient(135deg,#fff,#f6f9ff)}h1{font-size:44px;margin:0 0 12px;color:#09265a}.lead{font-size:18px;line-height:1.8;color:#3f4d63}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}.stat{padding:15px;border:1px solid #dce8f8;border-radius:16px;background:#fff}.stat strong{display:block;font-size:25px;color:#1456c0;line-height:1.2}.stat span{font-size:13px;color:#64748b}main{padding:34px 48px}section{margin:0 0 34px;padding:0;border:0;background:transparent}h2{display:block;margin:0 0 20px;font-size:27px;color:#09265a;border-left:6px solid #1456c0;padding-left:13px;line-height:1.35}h2:before{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:15px}.card{display:flex;flex-direction:column;padding:21px;border:1px solid #e4ebf4;border-radius:19px;background:#fbfdff}.card h3{font-size:20px;color:#1456c0;line-height:1.4;margin:0 0 10px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px}.pill{display:inline-flex;font-size:12px;font-weight:800;padding:5px 9px;border:0;border-radius:999px;background:#edf3fa;color:#475569}.pill.s{background:#fff0f2;color:#b51e3e}.pill.a{background:#ecfaf4;color:#087453}.pill.b{background:#fff7e6;color:#9a5b00}.card p{margin:9px 0;color:#334155;line-height:1.75}.card b{color:#172033}.sources{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}.sources a{padding:7px 10px;border-radius:10px;background:#edf5ff;color:#1456c0;text-decoration:none;font-size:13px;border:1px solid #d5e6fb}.sources a:hover{background:#e4f0ff}.summary{padding:24px;border-radius:20px;background:linear-gradient(135deg,#124fb5,#0f766e);color:#fff}.summary ol{margin:0;padding-left:23px}.summary li{margin:8px 0}.box,.references{padding:22px;border:1px solid #e4ebf4;border-radius:19px;background:#f8fbff}.box ul,.references ol{margin:0;padding-left:23px}.box li,.references li{margin:8px 0;line-height:1.75}.box b{color:#0f766e}.references a{color:#1456c0;text-decoration:none;word-break:break-all}footer{margin:0;padding:22px 48px;background:#f7faff;color:#64748b;border-top:1px solid #e5ebf4;text-align:left;font-size:14px}@media(max-width:720px){body{padding:10px}header,main,footer{padding:24px}h1{font-size:34px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}''',
            'index.html': '''*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#f8fbff);color:#12213a;min-height:100vh;padding:40px 20px}.wrap{max-width:980px;margin:auto}.hero{background:white;border:1px solid #e7eefc;border-radius:28px;padding:46px;box-shadow:0 18px 48px rgba(11,45,112,.10)}h1{font-size:48px;line-height:1.15;margin:0;color:#081f4d}.desc{margin-top:16px;color:#475569;font-size:17px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:30px}.card{display:block;text-decoration:none;background:#fbfdff;border:1px solid #e8eef8;border-radius:20px;padding:24px;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(11,45,112,.08)}.card h2{font-size:22px;color:#0b4fd8;margin-bottom:10px}.card p{color:#64748b;line-height:1.7}.more{margin-top:22px;text-align:right}.more a{color:#0b4fd8;font-weight:700;text-decoration:none}.footer{margin-top:24px;color:#64748b;text-align:center;font-size:14px}a{color:#0b4fd8}@media(max-width:720px){body{padding:16px 10px}.hero{padding:28px 22px}h1{font-size:38px}.grid{grid-template-columns:1fr}}''',
            'archive.html': '''*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#f4f8ff;color:#12213a;padding:40px 20px}.wrap{max-width:900px;margin:auto}.panel{background:white;border:1px solid #e7eefc;border-radius:24px;padding:38px;box-shadow:0 14px 42px rgba(11,45,112,.08)}.back{display:inline-block;margin-bottom:18px;color:#0b4fd8;text-decoration:none;font-weight:700}h1{font-size:38px;color:#081f4d;margin-bottom:12px}.desc{color:#64748b;line-height:1.7;margin-bottom:28px}.list{display:grid;gap:16px}.item{display:block;text-decoration:none;border:1px solid #e8eef8;border-radius:18px;padding:22px;background:#fbfdff}.item:hover{box-shadow:0 10px 24px rgba(11,45,112,.08)}.item h2{color:#0b4fd8;font-size:22px;margin-bottom:8px}.item p{color:#64748b;line-height:1.7}@media(max-width:650px){body{padding:16px 10px}.panel{padding:26px 22px}h1{font-size:34px}}'''
          }

          for filename, css in styles.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'<style>.*?</style>', f'<style>{css}</style>', text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'Unable to replace style in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit restored UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/2026-07-13.html index.html archive.html
          git rm .github/workflows/restore-original-ui.yml
          git commit -m "Restore original light UI palette"
          git push
